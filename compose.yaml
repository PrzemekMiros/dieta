services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tortowe
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: tortowe
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - tortowe_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tortowe']
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
volumes:
  tortowe_pg:
